<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3691"/>
      <stop offset="0.55" stop-color="#2b2770"/>
      <stop offset="1" stop-color="#1c1950"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#8b85e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b85e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <!-- inner top highlight -->
  <rect x="106" y="106" width="812" height="812" rx="180" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>

  <!-- element symbol -->
  <text x="500" y="540" text-anchor="middle" font-family="Baskerville" font-weight="600" font-size="400" fill="#f4f3ff" letter-spacing="-6">Sp</text>

  <!-- waveform "atomic mass" line -->
  <g fill="url(#wave)">
    <rect x="273"  y="746" width="30" height="58"  rx="15"/>
    <rect x="327"  y="724" width="30" height="102" rx="15"/>
    <rect x="381"  y="736" width="30" height="78"  rx="15"/>
    <rect x="435"  y="702" width="30" height="146" rx="15"/>
    <rect x="489"  y="690" width="30" height="170" rx="15"/>
    <rect x="543"  y="712" width="30" height="126" rx="15"/>
    <rect x="597"  y="696" width="30" height="158" rx="15"/>
    <rect x="651"  y="730" width="30" height="90"  rx="15"/>
    <rect x="705"  y="720" width="30" height="110" rx="15"/>
    <rect x="759"  y="742" width="30" height="66"  rx="15"/>
  </g>
</svg>
