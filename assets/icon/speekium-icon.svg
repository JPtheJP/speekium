<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bf6"/>
      <stop offset="0.55" stop-color="#1d8fd6"/>
      <stop offset="1" stop-color="#0aa6b4"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5b7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="106" y="106" width="812" height="812" rx="180" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5"/>

  <!-- speech bubble -->
  <path d="M328 315 H696 a78 78 0 0 1 78 78 V507 a78 78 0 0 1 -78 78 H470 L400 682 L372 585 H328
           a78 78 0 0 1 -78 -78 V393 a78 78 0 0 1 78 -78 Z" fill="#ffffff"/>

  <!-- waveform inside the bubble -->
  <g fill="url(#wave)">
    <rect x="343" y="418" width="26" height="64"  rx="13"/>
    <rect x="395" y="384" width="26" height="132" rx="13"/>
    <rect x="447" y="346" width="26" height="208" rx="13"/>
    <rect x="499" y="402" width="26" height="96"  rx="13"/>
    <rect x="551" y="366" width="26" height="168" rx="13"/>
    <rect x="603" y="392" width="26" height="116" rx="13"/>
    <rect x="655" y="422" width="26" height="56"  rx="13"/>
